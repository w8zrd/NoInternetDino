<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dino Game</title>
<style>
html, body {
  padding: 0;
  margin: 0;
  width: 100%;
  height: 100%;
  background: #fff;
}
#main-frame-error {
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  position: relative;
}
.runner-container {
  height: 150px;
  max-width: 600px;
  overflow: hidden;
  position: absolute;
  top: 50%;
  margin-top: -75px;
  width: 44px;
}
.runner-canvas {
  height: 150px;
  max-width: 600px;
  opacity: 1;
  overflow: hidden;
  position: absolute;
  top: 0;
  z-index: 2;
}
#tap-prompt {
  position: absolute;
  top: calc(50% + 110px);
  width: 100%;
  text-align: center;
  font-family: sans-serif;
  font-size: 18px;
  color: #808080;
  pointer-events: none;
}
</style>
</head>
<body class="offline">
<div id="main-frame-error">
  <div id="tap-prompt">Tap the dino to play</div>
</div>
<div id="offline-resources" style="display:none">
  <img id="offline-resources-1x" src="img/sprite-1x.png">
  <img id="offline-resources-2x" src="img/sprite-2x.png">
  <template id="audio-resources">
    <audio id="offline-sound-press" src="sounds/button-press.mp3"></audio>
    <audio id="offline-sound-hit" src="sounds/hit.mp3"></audio>
    <audio id="offline-sound-reached" src="sounds/score-reached.mp3"></audio>
  </template>
</div>
<script src="js/game.js"></script>
<script>
document.addEventListener('pointerdown', function() {
  var tp = document.getElementById('tap-prompt');
  if (tp) tp.style.display = 'none';
}, { once: true });
</script>
</body>
</html>
